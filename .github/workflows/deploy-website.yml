# ============================================================
# tpl-website 官网 → GitHub Pages 部署
# 发布目标：https://fellow99.github.io/tpl-website/  （项目页 / Project Page）
#
# 说明：
#   - 本工作流位于 tpl-website 仓库内，由 GitHub Actions 从该仓库根检出。
#   - 官网静态资源（index.html / images/ / js/ / style/）即位于仓库根。
#   - 使用官方 actions/deploy-pages + actions/upload-pages-artifact（现代 Pages 部署）。
#   - 需在本仓库 Settings → Pages → Build and deployment → Source: GitHub Actions。
#
# 触发：推送到 main / 手动触发 / 每日定时
# ============================================================

name: Deploy Website (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

# 仅授予 Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一次；push 触发的新构建会取消运行中的旧构建
concurrency:
  group: pages-website
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 挑选官网静态资源到独立产物目录（与 deploy/Dockerfile.tpl-website 的筛选口径一致）
      - name: Stage static assets
        run: |
          mkdir -p site
          cp *.html site/
          cp -r images site/
          cp -r js site/
          cp -r style site/
          echo "---- site/ contents ----"
          find site -type f | sort

      # 启用 GitHub Pages 并获取部署端点
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 上传静态站点产物
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
